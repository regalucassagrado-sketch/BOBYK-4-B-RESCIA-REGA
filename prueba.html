<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body>
<div> 
<h1>Formulario 1 </h1>
<p>Completa los campos </p>
<p>Campos marcados con * son obligatorios </p>



<form action="#" method="POST" id="registroForm"></form>
</div>

<fieldset>
        <legend>Datos Personales</legend>


<div>
    <label for="nombre">Nombre *</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan " required>
</div>


<div>
    <label for="Apellido">Apellido *</label>
    <input type="text" id="Apellido" name="Apellido" placeholder="Ej:  Pérez" required>
</div>

<div>
    <label for="DNI">DNI *</label>
    <input type="number" id="DNI" name="DNI" placeholder="Ej: 48503456 " required>
</div>

<div>
    <label for="Fecha de nacimiento">Fecha de nacimiento </label>
    <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" placeholder="Ej: 18/5/96 " >
</div>

<div>
    <label for="Correo electrónico">Correo electrónico *</label>
    <input type="email" id="Correo electrónico" name="Correo electrónico" placeholder="Ej: xxxxxxx@gmail.com " required>
</div>

<div>
    <label for="Número de teléfono">Número de teléfono</label>
    <input type="number" id="Número de teléfono" name="Número de teléfono" placeholder="Ej: +5491123455077 " required>
</div>

</fieldset>

<fieldset>
        <legend>Datos Extras</legend>



        
<div>
                    <label for="pais">País *</label>
                    <select id="pais" name="pais" required>
                        <option value="">Seleccione un curso </option>
                        <option value="IB">Inglés Básico</option>
                        <option value="PW">Programación Web</option>
                        <option value="BD">Base de Datos</option>
                        <option value="RI">Redes Informáticas</option>
                        
                    </select>
                </div>

                <div>
                    <label>Turnos</label>
                    <div>
                        <label>
                            <input type="radio" name="Turno" value="Mañana">
                            Mañana
                        </label>
                        <label>
                            <input type="radio" name="Turno" value="Tarde">
                            Tarde
                        </label>
                        <label>
                            <input type="radio" name="Turno" value="Noche">
                            Noche
                        </label>
                        
                    </div>
                </div>
<div>
                    <label>Habilidades</label>
                    <div>
                        <label>
                            <input type="checkbox" name="habilidades" value="HTML">
                            HTML
                        </label>
                        <label>
                            <input type="checkbox" name="habilidades" value="CSS">
                            CSS
                        </label>
                        <label>
                            <input type="checkbox" name="habilidades" value="JavaScript">
                            JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="habilidades" value="Otro">
                            Otro
                        </label>
                        
                    </div>
                </div>
<div>
                    <label for="comentarios">Explicacion</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Explicar por qué desea realizar el curso."></textarea>
                </div>





</fieldset>


            <fieldset>
                <legend>Datos de Seguridad</legend>

                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Debe contener un minimo de  8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita su contraseña" minlength="8" required>
                </div>

                <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a> *
                </label>
            </div>

            
            <div>
                <button type="submit">Enviar inscripción</button>
                <button type="reset">Reiniciar formulario</button>
            </div>
        </form>
    </div>    

            </fieldset>


<footer>
        <p>Formulario 1 hecho por: Rescia y Rega</p>
    </footer>

</body>
</html>
